<!doctype html>
<html lang="pt-BR" data-theme="serviceit-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinOps - Service IT</title>
    <script>
      // Aplica o skin salvo antes do React montar, para a tela não piscar.
      // Mantenha a lista e a regra de migração em sincronia com src/theme/themes.ts.
      (function () {
        var themes = { 'serviceit-light': 'light', 'serviceit-dark': 'dark' };
        try {
          var saved = window.localStorage.getItem('finops.theme');
          var theme = null;
          if (saved && themes.hasOwnProperty(saved)) {
            theme = saved;
          } else if (saved) {
            // Skin renomeado: migra pelo modo ("*-dark" / "*-light") e regrava o id novo.
            var mode = /-dark$/.test(saved) ? 'dark' : /-light$/.test(saved) ? 'light' : null;
            for (var id in themes) {
              if (mode && themes[id] === mode) { theme = id; break; }
            }
            if (theme) window.localStorage.setItem('finops.theme', theme);
          }
          if (theme) document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* localStorage indisponível: fica o padrão */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
