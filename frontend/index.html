<!doctype html>
<html lang="pt-BR" data-theme="serviceit-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinOps - Service IT</title>
    <script>
      // Aplica o skin salvo antes do React montar, para a tela não piscar.
      // Mantenha a lista em sincronia com src/theme/themes.ts.
      (function () {
        var themes = ['serviceit-light', 'highlander-dark'];
        try {
          var saved = window.localStorage.getItem('finops.theme');
          if (themes.indexOf(saved) !== -1) {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* localStorage indisponível: fica o padrão */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
